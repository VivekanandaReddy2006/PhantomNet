name: PhantomNet Month 5 CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    
    env:
      # Mock LLM responses by disabling real LLM calls
      SENTINEL_LLM_ENABLED: "false"
      ENVIRONMENT: "test"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies for PDF generation and DB
      run: |
        sudo apt-get update
        # Install dependencies for PDF generation (xhtml2pdf / reportlab / weasyprint)
        sudo apt-get install -y sqlite3 libpango-1.0-0 libpangoft2-1.0-0 libjpeg-dev zlib1g-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-asyncio httpx

    - name: Run Month 5 Tests (TAXII, LLM, PDF)
      run: |
        python -m pytest backend/tests/test_taxii.py backend/tests/test_taxii_client.py backend/tests/test_llm_service.py backend/tests/test_sentinel_service_llm.py test_pdf_export.py -v
